<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24594d"><title>英文句子筆記本</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f3;color:#253d36;font-family:Arial,'Noto Sans TC',sans-serif;font-size:17px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #d9e1d9;border-radius:12px;padding:11px 17px;background:white;color:#254d42}button:hover{background:#e9f0e8}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b5bf7b;outline-offset:2px}.primary{background:#285e50;color:white;border-color:#285e50}.primary:hover{background:#194b3e}header{border-bottom:1px solid #e0e5db;background:#fffef9}.top{max-width:1140px;margin:auto;padding:23px 24px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:bold;display:flex;gap:12px;align-items:center}.logo{background:#285e50;color:white;padding:10px;border-radius:12px}.small{font-size:13px;color:#6d7d73}.wrap{max-width:1140px;margin:auto;padding:42px 24px}.hero{display:flex;justify-content:space-between;gap:30px;align-items:center;margin-bottom:32px}.eyebrow{font-size:12px;letter-spacing:3px;color:#6b826b}h1{font-size:36px;margin:14px 0}p{line-height:1.7;color:#738075}.count{background:#e9eedd;border-radius:20px;padding:23px 30px;min-width:170px}.count strong{font-size:36px;display:block;color:#285e50}.layout{display:grid;grid-template-columns:340px 1fr;gap:26px;align-items:start}.panel{background:#fffefb;border:1px solid #e0e5da;border-radius:20px;padding:25px;box-shadow:0 4px 16px #23472b04}h2{font-size:20px;margin:0 0 20px}label{display:block;font-size:14px;font-weight:bold;margin:18px 0 9px}textarea,input,select{width:100%;border:1px solid #d9e0d5;border-radius:10px;padding:12px;color:#293f35;background:white;min-width:0}textarea{resize:vertical;line-height:1.6}.wide{width:100%;margin-top:18px}.hint{font-size:13px;line-height:1.7;color:#7c887c}.settings{margin-top:24px;border-top:1px solid #e6e9e0;padding-top:5px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar{display:flex;gap:10px;margin-bottom:18px}.toolbar input{flex:1}.card{background:#fffefb;border:1px solid #dee5d9;border-radius:18px;padding:23px;margin-bottom:15px}.meta{font-size:12px;letter-spacing:1px;color:#85917e}.sentence{font-family:Georgia,serif;font-size:25px;line-height:1.5;color:#263e34;margin:14px 0;overflow-wrap:anywhere}.note{font-size:15px;color:#7d857a;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.actions button{font-size:14px;padding:9px 13px}.actions .play{background:#edf2e7;border-color:#edf2e7;color:#30573d}.empty{text-align:center;padding:55px 20px;color:#7b897a;border:1px dashed #ccd6c7;border-radius:18px}.status{min-height:25px;font-size:14px;color:#356044;margin-top:10px}.foot{margin-top:30px;font-size:12px;color:#86917e;text-align:center}.active{border-color:#749473;box-shadow:0 0 0 2px #dfe9d9}.badge{border-radius:20px;background:#eef1e5;padding:6px 12px;font-size:12px}.danger{color:#9d4b42}@media(max-width:760px){.wrap{padding:28px 16px}.top{padding:18px 16px}.layout{grid-template-columns:1fr}.hero{gap:10px}h1{font-size:28px}.count{padding:18px;min-width:95px}.count strong{font-size:28px}.hero p{font-size:14px}.sentence{font-size:24px}.panel{padding:20px}.top .small{display:none}} 
</style></head><body><header><div class="top"><div class="brand"><span class="logo">Aa</span> 英文句子筆記本</div><span class="small">MY EVERYDAY ENGLISH</span><span class="badge">每天一句，慢慢進步</span></div></header><main class="wrap"><div class="hero"><div><div class="eyebrow">COLLECT · LISTEN · PRACTICE</div><h1>學習英文，變成日常</h1><p>記下喜歡的句子，跟著練習。</p></div><div class="count"><strong id="count">0</strong><span class="small">個收藏</span></div></div><div class="layout"><aside class="panel"><h2 id="formTitle">＋ 新增一句英文</h2><form id="form"><label for="english">完整英文句子</label><textarea id="english" rows="4" required placeholder="例如：How was your day?" lang="en"></textarea><label for="note">中文意思／學習筆記 <span class="small">（選填）</span></label><textarea id="note" rows="2" placeholder="記下意思或使用情境"></textarea><button class="primary wide" id="save">＋ 加入筆記本</button><button type="button" class="wide" id="cancel" hidden>取消編輯</button></form><div class="settings"><label for="voice">英文朗讀聲音</label><select id="voice" aria-label="英文朗讀聲音"></select><div class="hint">聲音由裝置提供，可選擇妳喜歡的英文聲音。</div><label for="repeat">每次朗讀次數</label><select id="repeat"><option value="1">1 次</option><option value="2">2 次</option><option value="3">3 次</option></select><button class="wide" id="stop">■ 停止朗讀</button></div><div id="status" class="status" role="status" aria-live="polite"></div></aside><section><div class="toolbar"><input id="search" placeholder="搜尋英文或中文筆記…" aria-label="搜尋句子"></div><div class="row" style="justify-content:space-between;margin-bottom:18px"><span id="listTitle" class="small">我的句子</span><div class="row"><button id="export" style="font-size:13px">匯出備份</button><button id="import" style="font-size:13px">匯入備份</button><input id="file" type="file" accept="application/json,.json" hidden></div></div><div id="list"></div><div class="hint">按「慢速」逐字聽清楚，再按「正常」練習自然語速。</div></section></div><div class="foot">句子自動儲存在目前裝置的瀏覽器。換手機或清除瀏覽資料前，請先匯出備份。</div></main><script>
const $=s=>document.querySelector(s),KEY='tina-english-notebook-v1';let items=[],editing=null,token=0;const supported='speechSynthesis'in window;let voices=[];
function status(t){$('#status').textContent=t}try{const raw=localStorage.getItem(KEY);if(raw){const a=JSON.parse(raw);if(!Array.isArray(a))throw Error();items=a.filter(x=>x&&typeof x.en==='string'&&typeof x.id==='string').map(x=>({...x,note:typeof x.note==='string'?x.note:''}));}}catch(e){status('讀取儲存資料失敗，請先確認瀏覽器設定或匯入備份。')}
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));items=next;render();return true}catch(e){status('儲存失敗，請匯出備份並確認瀏覽器儲存空間。');return false}}
function render(){const q=$('#search').value.toLowerCase();$('#count').textContent=items.length;const found=items.filter(x=>(x.en+' '+x.note).toLowerCase().includes(q));$('#listTitle').textContent=q?`搜尋結果 · ${found.length} 句`:`我的句子 · ${items.length} 句`;$('#list').replaceChildren();if(!found.length){const e=document.createElement('div');e.className='empty';e.textContent=q?'找不到符合的句子。':'筆記本的第一頁，留給妳今天學到的句子。';$('#list').append(e)}found.forEach((x,i)=>{const c=document.createElement('article');c.className='card';c.dataset.id=x.id;const meta=document.createElement('div');meta.className='meta';meta.textContent=`SENTENCE ${String(i+1).padStart(2,'0')}`;const en=document.createElement('div');en.className='sentence';en.lang='en';en.textContent=x.en;const n=document.createElement('div');n.className='note';n.textContent=x.note;const a=document.createElement('div');a.className='actions';[['▶ 慢速',()=>speak(x,.7),'play'],['▶ 正常',()=>speak(x,1),'play'],['編輯',()=>edit(x),''],['刪除',()=>{if(confirm('確定刪除這個句子？')&&persist(items.filter(y=>y.id!==x.id))){if(editing===x.id)reset();status('已刪除句子。')}},'danger']].forEach(([t,f,cl])=>{const b=document.createElement('button');b.textContent=t;b.className=cl;b.onclick=f;a.append(b)});c.append(meta,en,n,a);$('#list').append(c)})}
function reset(){editing=null;$('#form').reset();$('#formTitle').textContent='＋ 新增一句英文';$('#save').textContent='＋ 加入筆記本';$('#cancel').hidden=true}function edit(x){editing=x.id;$('#english').value=x.en;$('#note').value=x.note;$('#formTitle').textContent='編輯英文句子';$('#save').textContent='儲存修改';$('#cancel').hidden=false;$('#english').focus();$('#form').scrollIntoView({behavior:'smooth',block:'center'})}
$('#form').onsubmit=e=>{e.preventDefault();const en=$('#english').value.trim(),note=$('#note').value.trim();if(!en)return;const next=editing?items.map(x=>x.id===editing?{...x,en,note}:x):[{id:(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2)),en,note},...items];if(persist(next)){reset();status('已儲存，隨時可以開始朗讀。')}};$('#cancel').onclick=reset;$('#search').oninput=render;
function stop(){token++;if(supported)speechSynthesis.cancel();document.querySelectorAll('.active').forEach(x=>x.classList.remove('active'))}function loadVoices(){if(!supported){$('#voice').innerHTML='<option>此瀏覽器不支援朗讀</option>';return}const old=$('#voice').value;voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));$('#voice').replaceChildren();const d=document.createElement('option');d.value='';d.textContent='裝置預設英文聲音';$('#voice').append(d);voices.forEach(v=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+' ('+v.lang+')';$('#voice').append(o)});$('#voice').value=old;if(!$('#voice').value)$('#voice').value=''}
function speak(x,rate){stop();if(!supported){status('此瀏覽器不支援朗讀，請使用 Chrome、Edge 或 Safari。');return}const t=token;let remaining=Number($('#repeat').value);const card=[...document.querySelectorAll('.card')].find(c=>c.dataset.id===x.id);card?.classList.add('active');function run(){if(t!==token)return;const u=new SpeechSynthesisUtterance(x.en);u.lang='en-US';u.rate=rate;const v=voices.find(v=>v.voiceURI===$('#voice').value);if(v){u.voice=v;u.lang=v.lang}u.onend=()=>{if(t!==token)return;if(--remaining>0)setTimeout(run,650);else{card?.classList.remove('active');status('朗讀完成，換妳跟著說說看。')}};u.onerror=e=>{if(t!==token)return;card?.classList.remove('active');status('朗讀未完成，請確認裝置音量與英文語音設定後重試。')};status(rate<1?'慢速朗讀中…':'正常語速朗讀中…');speechSynthesis.speak(u)}run()}
$('#stop').onclick=()=>{stop();status('已停止朗讀。')};if(supported){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}else loadVoices();
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,sentences:items},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='english-notebook-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);status('已匯出句子備份。')};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());const a=Array.isArray(data)?data:data.sentences;if(!Array.isArray(a)||a.some(x=>!x||typeof x.en!=='string'||!x.en.trim()||(x.note!=null&&typeof x.note!=='string')))throw Error();let n=0;const next=[...items];for(const x of a){if(!next.some(y=>y.en===x.en.trim()&&y.note===(x.note||''))){next.push({id:(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2)),en:x.en.trim(),note:x.note||''});n++}}if(persist(next))status(`已匯入 ${n} 個句子，保留原有筆記。`)}catch(err){status('無法匯入，請選擇本筆記本匯出的 JSON 備份。')}e.target.value=''};render();
</script></body></html>
